<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#glowGrad)" stroke-width="6" />

  <!-- Outer Ring Glow -->
  <circle cx="256" cy="230" r="140" fill="#022c22" opacity="0.35" />

  <!-- Shopping Bag / Cart Element -->
  <g filter="url(#shadow)">
    <!-- Bag Handle -->
    <path d="M 196 170 C 196 125, 316 125, 316 170" fill="none" stroke="#f1f5f9" stroke-width="20" stroke-linecap="round" />
    
    <!-- Bag Body -->
    <path d="M 140 180 L 170 340 C 173 355, 185 365, 200 365 L 312 365 C 327 365, 339 355, 342 340 L 372 180 Z" fill="#ffffff" />
    
    <!-- Bag Accent Cut -->
    <path d="M 140 180 L 372 180 L 356 220 L 156 220 Z" fill="#e2e8f0" />
    
    <!-- Pizza Slice / Fork Symbol on the Bag -->
    <g transform="translate(256, 280)">
      <!-- Pizza Slice in Orange -->
      <path d="M 0 -35 L 35 25 A 45 45 0 0 1 -35 25 Z" fill="#f97316" />
      <!-- Crust -->
      <path d="M -35 25 A 45 45 0 0 0 35 25" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" />
      <!-- Cheese dots -->
      <circle cx="-5" cy="5" r="4.5" fill="#fef08a" />
      <circle cx="10" cy="-5" r="3.5" fill="#fef08a" />
      <circle cx="2" cy="18" r="4" fill="#fef08a" />
      <circle cx="-15" cy="18" r="3" fill="#dc2626" />
      <circle cx="16" cy="14" r="3.5" fill="#dc2626" />
    </g>
  </g>

  <!-- Bottom Badge: "TWIN COURSES" -->
  <g transform="translate(256, 425)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#022c22" stroke="#34d399" stroke-width="3" />
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f1f5f9" text-anchor="middle" letter-spacing="2">
      TWIN COURSES
    </text>
  </g>
</svg>